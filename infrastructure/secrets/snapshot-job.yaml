apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-snapshot-script
  namespace: openbao
data:
  snapshot.py: |
    """Daily encrypted Raft snapshot; no API token or plaintext archive is persisted."""

    import datetime as dt
    import hashlib
    import json
    import os
    from pathlib import Path
    import ssl
    import time
    import urllib.request

    from cryptography.hazmat.primitives.ciphers.aead import AESGCM

    context = ssl.create_default_context(cafile='/run/ca/ca.crt')


    def api(address, path, payload=None, token=None):
        headers = {'Content-Type': 'application/json'}
        if token:
            headers['X-Vault-Token'] = token
        request = urllib.request.Request(
            address + '/v1/' + path,
            headers=headers,
            data=json.dumps(payload).encode() if payload is not None else None,
        )
        with urllib.request.urlopen(request, context=context, timeout=90) as response:
            return response.read()


    def main():
        address = None
        for i in range(3):
            candidate = f'https://openbao-{i}.openbao-internal.openbao.svc:8200'
            if json.loads(api(candidate, 'sys/leader'))['is_self']:
                address = candidate
                break
        if not address:
            raise RuntimeError('No Raft leader')
        result = json.loads(
            api(
                address,
                'auth/kubernetes/login',
                {'role': 'odoo-bootstrap', 'jwt': Path('/run/auth/token').read_text().strip()},
            )
        )
        raw = api(address, 'sys/storage/raft/snapshot', token=result['auth']['client_token'])
        nonce = os.urandom(12)
        encrypted = AESGCM(Path('/run/key/key').read_bytes()).encrypt(
            nonce, raw, b'odoo-openbao-snapshot-v1'
        )
        path = Path('/backups') / (
            dt.datetime.now(dt.timezone.utc).strftime('%Y%m%dT%H%M%SZ') + '.snapshot.aesgcm'
        )
        os.umask(0o077)
        temporary = path.with_suffix('.partial')
        with temporary.open('wb') as stream:
            stream.write(b'ODOO-BAO-1\n' + nonce + encrypted)
            stream.flush()
            os.fsync(stream.fileno())
        temporary.replace(path)
        for old in Path('/backups').glob('*.snapshot.aesgcm'):
            if time.time() - old.stat().st_mtime > 7 * 86400:
                old.unlink()
        print(
            json.dumps(
                {
                    'status': 'PASS',
                    'archive': path.name,
                    'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                }
            )
        )


    if __name__ == '__main__':
        try:
            main()
        except Exception as error:
            print(json.dumps({'status': 'FAIL', 'error_type': type(error).__name__}))
            raise SystemExit(1)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao-snapshots
  namespace: openbao
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  namespace: openbao
spec:
  schedule: 15 3 * * *
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            odoo.io/openbao-snapshot: 'true'
        spec:
          serviceAccountName: bao-bootstrap
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: snapshot
            image: docker.io/library/odoo:19.0@sha256:dd9013e669caaa23d26765dc55814655eaeecca7cfc2c265dbabae913bce22fd
            command:
            - python3
            - /opt/snapshot/snapshot.py
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: script
              mountPath: /opt/snapshot
              readOnly: true
            - name: auth
              mountPath: /run/auth
              readOnly: true
            - name: ca
              mountPath: /run/ca
              readOnly: true
            - name: key
              mountPath: /run/key
              readOnly: true
            - name: backups
              mountPath: /backups
              readOnly: false
          volumes:
          - name: script
            configMap:
              name: openbao-snapshot-script
          - name: auth
            projected:
              sources:
              - serviceAccountToken:
                  path: token
                  audience: openbao
                  expirationSeconds: 900
          - name: ca
            secret:
              secretName: openbao-ca
              defaultMode: 292
          - name: key
            secret:
              secretName: openbao-snapshot-key
              defaultMode: 288
          - name: backups
            persistentVolumeClaim:
              claimName: openbao-snapshots
