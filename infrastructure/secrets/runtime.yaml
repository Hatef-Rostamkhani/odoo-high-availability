apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-rotator
  namespace: secrets-system
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secret-rotator
  namespace: secrets-system
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: secret-rotator
      odoo.io/secrets-worker: controller
  template:
    metadata:
      labels: *id001
      annotations:
        checksum/code: c530ef4188630cdb23cad49630b95cd97201216b35ab534a986452d8cc9ad90d
    spec:
      serviceAccountName: secret-rotator
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels: *id001
