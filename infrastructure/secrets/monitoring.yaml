apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: odoo-secrets
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: odoo.secrets
    rules:
    - alert: OdooCredentialRotationFailed
      expr: max(odoo_secret_rotation_last_error_timestamp_seconds{namespace="secrets-system"})
        > max(odoo_secret_rotation_last_success_timestamp_seconds{namespace="secrets-system"})
        and on() max(odoo_secrets_enabled{namespace="secrets-system"}) == 1
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: Credential rotation has failed; expiry will not be extended
    - alert: OdooCredentialDeadlineNear
      expr: min(odoo_secret_credential_remaining_seconds{namespace="secrets-system"})
        < 600 and on() max(odoo_secrets_enabled{namespace="secrets-system"})
        == 1
      labels:
        severity: critical
      annotations:
        summary: Odoo database credential expires within ten minutes
    - alert: OdooExpiryGuardMissing
      expr: kube_deployment_status_replicas_available{namespace="secrets-system",deployment="secret-expiry-guard"}
        < 2
      labels:
        severity: warning
      annotations:
        summary: Expiry guard redundancy is lost
    - alert: OdooExpiryGuaranteeLost
      expr: kube_deployment_status_replicas_available{namespace="secrets-system",deployment="secret-expiry-guard"}
        == 0 or absent(odoo_secret_guard_last_success_timestamp_seconds{namespace="secrets-system",service="secret-expiry-guard"})
        or time() - max(odoo_secret_guard_last_success_timestamp_seconds{namespace="secrets-system",service="secret-expiry-guard"})
        > 5
      labels:
        severity: critical
      annotations:
        summary: Open sessions no longer have the five-second expiry guarantee
    - alert: OpenBaoSealedOrUnavailable
      expr: kube_statefulset_status_replicas_ready{namespace="openbao",statefulset="openbao"}
        < 3
      for: 30s
      labels:
        severity: critical
      annotations:
        summary: OpenBao is missing an unsealed Ready member
    - alert: OdooSecretsESOUnavailable
      expr: kube_deployment_status_replicas_available{namespace="external-secrets",deployment="external-secrets"}
        < 1
      labels:
        severity: critical
      annotations:
        summary: ESO cannot publish a new Odoo credential
    - alert: OpenBaoSnapshotStale
      expr: time() - max(kube_job_status_completion_time{namespace="openbao",job_name=~"openbao-snapshot.*"})
        > 90000 or absent(kube_job_status_completion_time{namespace="openbao",job_name=~"openbao-snapshot.*"})
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: No successful encrypted Raft snapshot in the last 25 hours
    - alert: OdooDatabaseAuthenticationFailures
      expr: sum(rate(odoo_odoo_database_authentication_failures_total{namespace="odoo-dev"}[1m]))
        > 0
      labels:
        severity: critical
      annotations:
        summary: Odoo database authentication is failing
