apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-secret-workers
  namespace: postgres-ha
spec:
  podSelector:
    matchLabels:
      postgres-operator.crunchydata.com/cluster: odoo-ha
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: secrets-system
    ports:
    - protocol: TCP
      port: 5432
