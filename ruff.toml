target-version = "py312"
line-length = 100
extend-exclude = ["vendor", ".tools", ".state", ".cache", "backups", "evidence", "dist"]

[lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82", "F811"]
ignore = ["E402"] # CLI scripts add the project module directory before imports.

[format]
quote-style = "single"
