apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    odoo.io/environment: dev
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    odoo.io/environment: dev
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: odoo-dev
  labels:
    odoo.io/environment: dev
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: gitops-system
  labels:
    odoo.io/environment: dev
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: odoo-dev
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
apiVersion: v1
kind: Namespace
metadata:
  name: odoo-edge
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
