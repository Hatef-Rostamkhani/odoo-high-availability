apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secrets-isolation
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8200
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9117
  - from:
    - ipBlock:
        cidr: 172.18.0.3/32
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 10250
    - protocol: TCP
      port: 8081
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openbao
    ports:
    - protocol: TCP
      port: 8200
