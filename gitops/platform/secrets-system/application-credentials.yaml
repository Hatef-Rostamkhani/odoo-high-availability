apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao-odoo
  namespace: odoo-dev
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc:8200
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: openbao-ca
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: odoo-eso
          serviceAccountRef:
            name: eso-odoo
            audiences:
            - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: odoo-ha-database
  namespace: odoo-dev
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshPolicy: Periodic
  refreshInterval: 30s
  secretStoreRef:
    name: openbao-odoo
    kind: SecretStore
  target:
    name: odoo-ha-database
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        credentials.json: '{{ dict "username" .username "password" .password "generation"
          .generation "issued_at" .issued_at "expires_at" .expires_at | toJson }}'
      metadata:
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
  data:
  - secretKey: username
    remoteRef:
      key: odoo-dev/odoo-db/active
      property: username
  - secretKey: password
    remoteRef:
      key: odoo-dev/odoo-db/active
      property: password
  - secretKey: generation
    remoteRef:
      key: odoo-dev/odoo-db/active
      property: generation
  - secretKey: issued_at
    remoteRef:
      key: odoo-dev/odoo-db/active
      property: issued_at
  - secretKey: expires_at
    remoteRef:
      key: odoo-dev/odoo-db/active
      property: expires_at
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-odoo
  namespace: odoo-dev
automountServiceAccountToken: false
