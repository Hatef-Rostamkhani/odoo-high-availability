apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: secrets-isolation
  namespace: openbao
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8200
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 9117
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openbao
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: external-secrets
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: secrets-system
    ports:
    - protocol: TCP
      port: 8200
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openbao
    ports:
    - protocol: TCP
      port: 8201
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openbao
    ports:
    - protocol: TCP
      port: 8200
    - protocol: TCP
      port: 8201
