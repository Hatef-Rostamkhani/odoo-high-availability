apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: odoo-platform
  source:
    repoURL: git://local-git.gitops-system.svc.cluster.local:9418/odoo-platform.git
    targetRevision: main
    path: gitops/platform/monitoring
    helm:
      releaseName: monitoring
      valueFiles:
      - ../../environments/dev/monitoring.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
    - RespectIgnoreDifferences=true
