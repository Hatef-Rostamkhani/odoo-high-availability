apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-system
  namespace: argocd
spec:
  project: odoo-secrets
  source:
    repoURL: git://local-git.gitops-system.svc.cluster.local:9418/odoo-platform.git
    targetRevision: main
    path: gitops/platform/secrets-system
  destination:
    server: https://kubernetes.default.svc
    namespace: secrets-system
  ignoreDifferences:
  - group: external-secrets.io
    kind: ExternalSecret
    name: odoo-ha-database
    namespace: odoo-dev
    jqPathExpressions:
    - .spec.data[].remoteRef.version
    jsonPointers:
    - /metadata/annotations/force-sync
  syncPolicy:
    syncOptions:
    - RespectIgnoreDifferences=true
