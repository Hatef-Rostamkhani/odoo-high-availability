apiVersion: v1
kind: Service
metadata:
  name: odoo
  annotations:
    odoo.io/configuration: declared
spec:
  selector: {app.kubernetes.io/name: odoo, odoo.io/component: server}
  ports:
    - {name: http, port: 8069, targetPort: http}
    {{- if gt (int .Values.workers) 0 }}
    - {name: websocket, port: 8072, targetPort: websocket}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if eq .Values.application.mode "ha" }}
  # Existing CoreDNS answers have a 30-second TTL. Let proxies discover surge pods.
  minReadySeconds: 35
  {{- end }}
  strategy:
    {{- if eq .Values.application.mode "ha" }}
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/name: odoo, odoo.io/component: server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: odoo, odoo.io/component: server}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "odoo.pod" (dict "Values" .Values "mode" "serve") | nindent 6 }}
