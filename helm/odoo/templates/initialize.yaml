{{- if .Values.initialization.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: odoo-initialize
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {app.kubernetes.io/name: odoo, odoo.io/component: initialization}
    spec:
      restartPolicy: Never
      {{- include "odoo.pod" (dict "Values" .Values "mode" "initialize") | nindent 6 }}
{{- end }}
