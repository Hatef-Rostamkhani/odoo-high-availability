{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.parentName }}{{ fail "gateway.parentName must name an existing Gateway" }}{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: odoo
spec:
  parentRefs: [{name: {{ .Values.gateway.parentName | quote }}}]
  hostnames: [{{ required "gateway.hostname is required" .Values.gateway.hostname | quote }}]
  rules:
    - backendRefs: [{name: odoo, port: 8069}]
{{- end }}
