apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-access
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: postgresql}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: odoo}
        - podSelector:
            matchLabels: {odoo.io/database-access: "true"}
      ports: [{protocol: TCP, port: 5432}]
  egress: []
