apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init
data:
  10-odoo.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    export ODOO_PASSWORD=$(cat /run/odoo-secret/password)
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
      --set=app_user={{ .Values.applicationUser | quote }} --set=app_db={{ .Values.database | quote }} <<'SQL'
    \getenv app_password ODOO_PASSWORD
    CREATE ROLE :"app_user" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'app_password';
    CREATE DATABASE :"app_db" OWNER :"app_user";
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
spec:
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
  selector: {app.kubernetes.io/name: postgresql}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-headless
spec:
  clusterIP: None
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
  selector: {app.kubernetes.io/name: postgresql}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
spec:
  serviceName: postgresql-headless
  replicas: {{ .Values.replicaCount }}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app.kubernetes.io/name: postgresql}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgresql}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 999, runAsGroup: 999, runAsNonRoot: true, fsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      terminationGracePeriodSeconds: 60
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          args: ["-c", "max_connections=60", "-c", "shared_buffers=128MB", "-c", "password_encryption=scram-sha-256"]
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: postgres}
            - {name: POSTGRES_PASSWORD_FILE, value: /run/admin-secret/password}
            - {name: POSTGRES_INITDB_ARGS, value: "--auth-host=scram-sha-256"}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          startupProbe:
            exec: {command: [pg_isready, -U, postgres, -d, postgres]}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: {command: [pg_isready, -U, postgres, -d, postgres]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, postgres, -d, postgres]}
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: admin-secret, mountPath: /run/admin-secret, readOnly: true}
            - {name: app-secret, mountPath: /run/odoo-secret, readOnly: true}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: init, configMap: {name: postgresql-init, defaultMode: 0555}}
        - {name: admin-secret, secret: {secretName: {{ .Values.adminSecret }}, defaultMode: 0440}}
        - {name: app-secret, secret: {secretName: {{ .Values.applicationSecret }}, defaultMode: 0440}}
        - {name: socket, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          argocd.argoproj.io/sync-options: Prune=false,Delete=false
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.className }}
        storageClassName: {{ .Values.storage.className | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
