<path d="M195 292V349" stroke="#59718f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M710 157V214" stroke="#59718f" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M710 292V349" stroke="#59718f" stroke-width="2" marker-end="url(#arrow)"/>
<text x="35" y="478" font-family="sans-serif" font-size="15" fill="#6f3e31">Local lab: all nodes and storage share one host. Production and host disaster recovery are unverified.</text></svg>
