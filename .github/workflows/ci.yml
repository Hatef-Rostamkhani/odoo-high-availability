name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Static and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies and checksum-verified tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml ripgrep
          python3 scripts/tools.py --only helm kubectl shellcheck kubeconform gitleaks actionlint ruff
      - name: Validate source, charts, schemas and unit contracts
        run: python3 scripts/report.py static bash tests/static.sh
      - name: Scan Git history
        run: .tools/bin/gitleaks git --redact --no-banner --log-opts=--all
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: static-evidence
          path: |
            evidence/static.json
            evidence/static.log
          retention-days: 7
          if-no-files-found: ignore

  unit:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies and Helm
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python scripts/tools.py --only helm
      - run: make test-unit

  integration:
    name: Odoo and PostgreSQL integration
    needs: [static, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install checksum-verified tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml
          python3 scripts/tools.py --only kind kubectl helm
      - name: Deploy, authenticate and verify persistent recovery
        run: python3 scripts/report.py ci-integration bash tests/ci/integration.sh
      - name: Upload sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: integration-evidence
          path: |
            evidence/ci-integration.json
            evidence/ci-integration.log
          retention-days: 7
          if-no-files-found: ignore
