name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic chart version (e.g. 1.0.0); manual runs only build artifacts
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies and locked tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml ripgrep
          python3 scripts/tools.py --only helm kubectl kind shellcheck kubeconform gitleaks actionlint ruff trivy
      - run: make test-static
      - run: .tools/bin/gitleaks git --redact --no-banner --log-opts=--all
      - run: make test-ci-integration
      - run: make security-gate

  package:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/tools.py --only helm gitleaks
      - run: make test-public
      - name: Package charts and public source
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: python3 scripts/package-release.py --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name release-packages --dir dist
      - name: Verify checksums and create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes ./*
