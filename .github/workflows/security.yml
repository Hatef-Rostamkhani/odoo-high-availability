name: Security inventory
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    name: Dependency and image security inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/tools.py --only trivy
      - run: python3 scripts/security-scan.py
      - name: Upload inventory and SBOMs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: security-inventory
          path: evidence/security/*.json
          retention-days: 14
          if-no-files-found: ignore
