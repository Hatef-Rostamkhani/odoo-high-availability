name: Security inventory
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    name: Dependency and image security inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 scripts/tools.py --only trivy
      - run: python3 scripts/security-scan.py
      - name: Upload inventory and SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-inventory
          path: evidence/security/*.json
          retention-days: 14
          if-no-files-found: ignore
