image: docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
stages: [validate]
validate:
  stage: validate
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl git make python3 python3-yaml ripgrep
    - bash scripts/install-tools.sh
  script:
    - python3 scripts/report.py static bash tests/static.sh
  artifacts:
    when: always
    paths: [evidence/static.json, evidence/static.log, evidence/results.md]
    expire_in: 7 days
# Live tests deliberately remain local. Never attach a production kubeconfig here.
